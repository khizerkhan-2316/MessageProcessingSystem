services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: message-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql

  rabbitmq:
    image: rabbitmq:4-management
    container_name: message-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  producer:
    build:
      context: .
      dockerfile: src/MessageProcessingSystem.Producer/Dockerfile
    container_name: message-producer
    depends_on:
      - rabbitmq
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_QUEUE: messages
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}

  consumer:
    build:
      context: .
      dockerfile: src/MessageProcessingSystem.Consumer/Dockerfile
    container_name: message-consumer
    depends_on:
      - rabbitmq
      - mssql
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_QUEUE: messages
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      DATABASE_CONNECTION_STRING: "Server=mssql,1433;Database=MessageProcessingSystem;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"

volumes:
  mssql-data:
  rabbitmq-data: